name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-check:
    name: app-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No instalar los hooks de git en CI (script `prepare`).
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Expo doctor
        run: npx expo-doctor
      - name: Versiones compatibles con el SDK
        run: npx expo install --check
      - name: format + lint + typecheck + capas + tests
        run: npm run check

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Solo es necesaria en organizaciones, no en cuentas personales.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
