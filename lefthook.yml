# Hooks de git (ver CLAUDE.md). No saltarse con --no-verify.
pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{js,cjs,mjs,ts,tsx,json,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,cjs,mjs,ts,tsx}'
      run: npx eslint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
